# ============================================================
# Netlify Configuration — Kuhni Landscaping
# ============================================================

[build]
  publish = "."        # serve files from the root folder

# Force HTTPS on all traffic
[[redirects]]
  from   = "http://kuhnilandscaping.net/*"
  to     = "https://kuhnilandscaping.net/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.kuhnilandscaping.net/*"
  to     = "https://www.kuhnilandscaping.net/:splat"
  status = 301
  force  = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Cache images aggressively (they rarely change)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS/JS with revalidation
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
